name: release-please

# Keeps an open release PR that bumps CONFIG.yaml framework_version, the README badge and
# CHANGELOG.md from Conventional Commits. Merging it publishes the release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write # release-please creates its autorelease:* labels

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # PRs opened with GITHUB_TOKEN do not trigger CI. Add a RELEASE_PLEASE_TOKEN
          # secret (fine-grained PAT: contents + pull requests write) so release PRs
          # run validate.yml; without it the built-in token is used.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # Every PR needs an owner: the release PR goes to the human who decides
      # when to release. Merging it stays a deliberate human action.
      - name: Assign release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Parsed in the shell: fromJSON() in env is evaluated even when the
          # step is skipped and fails on an empty output.
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          number=$(jq -r '.number // empty' <<<"$PR_JSON")
          [ -n "$number" ] && gh pr edit "$number" -R "$GITHUB_REPOSITORY" --add-assignee wlfghdr
