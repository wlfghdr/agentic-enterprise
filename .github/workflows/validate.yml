      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate OTel contract compliance
        run: python3 scripts/validate_otel_contract.py

  validate-compliance-mapping:
    name: validate-compliance-mapping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate compliance mappings
        run: python3 scripts/validate_compliance_mapping.py

  validate-compliance-coverage:
    name: validate-compliance-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report compliance coverage gaps
        run: python3 scripts/validate_compliance_coverage.py --warn-unmapped-pct 25

  validate-config-completeness:
    name: validate-config-completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Self-check (script integrity)
        run: python3 scripts/validate_config_completeness.py --self-check

      - name: Validate CONFIG.yaml completeness
        run: python3 scripts/validate_config_completeness.py

  validate-exception-expiry:
    name: validate-exception-expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-check (script integrity)
        run: python3 scripts/validate_exception_expiry.py --self-check

      - name: Check governance exception expiry
        run: python3 scripts/validate_exception_expiry.py --warn-days 30

  validate-vendor-compliance:
    name: validate-vendor-compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Self-check (script integrity)
        run: python3 scripts/validate_vendor_compliance.py --self-check

      - name: Validate vendor compliance attestations
        run: python3 scripts/validate_vendor_compliance.py

  validate-otel-evidence-chain:
    name: validate-otel-evidence-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-check (script integrity)
        run: python3 scripts/validate_otel_evidence_chain.py --self-check

      - name: Validate OTel evidence chain
        run: python3 scripts/validate_otel_evidence_chain.py

  validate-control-linkage:
    name: validate-control-linkage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-check (script integrity)
        run: python3 scripts/validate_control_linkage.py --self-check

      - name: Validate risk-to-control-to-evidence chain
        run: python3 scripts/validate_control_linkage.py

  validate-integration-registry:
    name: validate-integration-registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate integration registry consistency
        run: python3 scripts/validate_integration_registry.py

  validate-agent-instructions:
    name: validate-agent-instructions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate agent instruction hierarchy
        run: python3 scripts/validate_agent_instructions.py

  validate-work-artifacts:
    name: validate-work-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate work artifact structure
        run: python3 scripts/validate_work_artifacts.py

  validate-cross-references:
    name: validate-cross-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate cross-reference integrity
        run: python3 scripts/validate_cross_references.py

  conftest:
    name: conftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install conftest
        run: |
          VERSION=0.51.0
          curl -sL \
            "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz" \
            | tar xz conftest
          sudo mv conftest /usr/local/bin/conftest
          conftest --version

      - name: Check template config policies
        run: |
          conftest test CONFIG.yaml \
            --policy policy/ \
            --data policy/ \
            --namespace config \
            --output table

      - name: Check workflow policies
        run: |
          conftest test .github/workflows/ \
            --policy policy/ \
            --data policy/ \
            --namespace workflows \
            --output table
